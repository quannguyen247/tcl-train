name: DFT learning examples

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tcl and Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl yosys
      - name: Run the open-source lesson checks
        run: python3 eda/dft/run_labs.py
