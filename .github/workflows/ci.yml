name: Tcl practice tests

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcl-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      cache-hit: ${{ steps.cache-tcl.outputs.cache-hit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore Tcl 9.1.0 and Thread 3.0.7
        id: cache-tcl
        uses: actions/cache@v6
        with:
          path: ~/.local/tcl91
          key: ${{ runner.os }}-tcl-9.1.0-thread-3.0.7-v4

      - name: Install build dependencies
        if: steps.cache-tcl.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential autoconf

      - name: Build Tcl 9.1.0
        if: steps.cache-tcl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch core-9-1-0 https://github.com/tcltk/tcl.git /tmp/tcl
          cd /tmp/tcl/unix
          ./configure --prefix="$HOME/.local/tcl91" --enable-threads
          make --jobs "$(nproc)"
          make install

      - name: Build Thread 3.0.7
        if: steps.cache-tcl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --recurse-submodules --branch thread-3-0-7 https://github.com/tcltk/thread.git /tmp/thread
          cd /tmp/thread
          mkdir -p tclconfig
          cp /tmp/tcl/unix/install-sh tclconfig/install-sh
          ./configure \
            --prefix="$HOME/.local/tcl91" \
            --with-tcl="/tmp/tcl/unix"
          make --jobs "$(nproc)"
          make install

      - name: Verify Tcl environment
        run: |
          TCLSH="$(find "$HOME/.local/tcl91/bin" -maxdepth 1 -type f -name 'tclsh*' | sort | head -n 1)"
          test -n "$TCLSH"
          "$TCLSH" <<'TCL'
          puts "Tcl [info patchlevel]"
          puts "Thread [package require Thread]"
          TCL

  generate-matrix:
    name: Discover Tests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate Matrix
        id: set-matrix
        run: |
          DIRS=$(cd practices && ls -d */ | sed 's#/##' | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=$DIRS" >> $GITHUB_OUTPUT

  test:
    name: ${{ matrix.practice }}
    needs: [build, generate-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        practice: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore Tcl Environment
        uses: actions/cache/restore@v6
        with:
          path: ~/.local/tcl91
          key: ${{ runner.os }}-tcl-9.1.0-thread-3.0.7-v4

      - name: Run ${{ matrix.practice }} Test
        run: |
          export RUN_ALL=1
          cd practices/${{ matrix.practice }}
          TCLSH="$(find "$HOME/.local/tcl91/bin" -maxdepth 1 -type f -name 'tclsh*' | sort | head -n 1)"
          test_file=$(ls *.test.tcl)
          "$TCLSH" "$test_file" -verbose p
