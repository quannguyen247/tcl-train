name: Tcl practice tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcl-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      cache-hit: ${{ steps.cache-tcl.outputs.cache-hit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Tcl 9.0.4 and Thread 3.0.6
        id: cache-tcl
        uses: actions/cache@v4
        with:
          path: ~/.local/tcl90
          key: ${{ runner.os }}-tcl-9.0.4-thread-3.0.6-v4

      - name: Install build dependencies
        if: steps.cache-tcl.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential autoconf

      - name: Build Tcl 9.0.4
        if: steps.cache-tcl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch core-9-0-4 https://github.com/tcltk/tcl.git /tmp/tcl
          cd /tmp/tcl/unix
          ./configure --prefix="$HOME/.local/tcl90" --enable-threads
          make --jobs "$(nproc)"
          make install

      - name: Build Thread 3.0.6
        if: steps.cache-tcl.outputs.cache-hit != 'true'
        run: |
          curl -sL https://downloads.sourceforge.net/project/tcl/Tcl/9.0.4/thread3.0.6.tar.gz | tar -xz -C /tmp
          mv /tmp/thread3.0.6 /tmp/thread
          cd /tmp/thread
          ./configure \
            --prefix="$HOME/.local/tcl90" \
            --with-tcl="/tmp/tcl/unix"
          make --jobs "$(nproc)"
          make install

      - name: Verify Tcl environment
        run: |
          TCLSH="$(find "$HOME/.local/tcl90/bin" -maxdepth 1 -type f -name 'tclsh*' | sort | head -n 1)"
          test -n "$TCLSH"
          "$TCLSH" <<'TCL'
          puts "Tcl [info patchlevel]"
          puts "Thread [package require Thread]"
          TCL

  generate-matrix:
    name: Discover Tests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate Matrix
        id: set-matrix
        run: |
          DIRS=$(cd practices && ls -d */ | sed 's#/##' | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=$DIRS" >> $GITHUB_OUTPUT

  test:
    name: ${{ matrix.practice }}
    needs: [build, generate-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        practice: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore Tcl Environment
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/tcl90
          key: ${{ runner.os }}-tcl-9.0.4-thread-3.0.6-v4

      - name: Run ${{ matrix.practice }} Test
        run: |
          export RUN_ALL=1
          cd practices/${{ matrix.practice }}
          TCLSH="$(find "$HOME/.local/tcl90/bin" -maxdepth 1 -type f -name 'tclsh*' | sort | head -n 1)"
          test_file=$(ls *.test.tcl)
          "$TCLSH" "$test_file" -verbose p
